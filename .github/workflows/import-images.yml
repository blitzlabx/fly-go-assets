name: Import Official Images

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/import-images.yml'

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download asset package
        run: |
          curl -fsSL -o /tmp/fly-go-assets-images.zip "https://litter.catbox.moe/2l0gun.zip"
          file /tmp/fly-go-assets-images.zip
          unzip -l /tmp/fly-go-assets-images.zip | head -40

      - name: Extract into repo paths
        run: |
          unzip -o /tmp/fly-go-assets-images.zip -d .
          find assets -name '*.png' | sort
          ls -la assets/branding/
          ls assets/characters/

      - name: Commit and push images
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/branding/*.png assets/characters/*/*.png
          if git diff --cached --quiet; then
            echo "No new images to commit"
            exit 0
          fi
          git commit -m "Add official Fly Go logo, character art, and emblems"
          git push
