name: Assemble v2 CSS/JS

on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/_v2/**'
      - '.github/workflows/assemble-v2.yml'

permissions:
  contents: write

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Decode and write CSS and JS
        run: |
          set -e
          mkdir -p css js
          python3 << 'PY'
          import base64, zlib
          from pathlib import Path
          root = Path('scripts/_v2')
          def load(prefix):
              parts = sorted(root.glob(prefix + 'p*'), key=lambda p: int(p.name.replace(prefix + 'p', '') or 0))
              if not parts:
                  raise SystemExit('missing parts for ' + prefix)
              data = ''.join(p.read_text().strip() for p in parts)
              return zlib.decompress(base64.b64decode(data))
          css = load('css')
          js = load('js')
          Path('css/styles.css').write_bytes(css)
          Path('js/app.js').write_bytes(js)
          print('css', len(css), 'js', len(js))
          print(css[:60].decode())
          print(js[:60].decode())
          PY

      - name: Commit assembled files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add css/styles.css js/app.js
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "Assemble Fly Go v2 styles.css and app.js"
          git push

      - name: Cleanup chunks
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -rf scripts/_v2
          git add -A scripts || true
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Remove temporary v2 assembly chunks"
          git push
