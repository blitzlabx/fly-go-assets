name: Apply Redesign

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/apply-redesign.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download redesign package
        run: |
          curl -fsSL -o /tmp/fly-go-redesign.zip "https://litter.catbox.moe/ieczie.zip"
          file /tmp/fly-go-redesign.zip
          unzip -l /tmp/fly-go-redesign.zip

      - name: Replace frontend files
        run: |
          unzip -o /tmp/fly-go-redesign.zip -d /tmp/redesign
          mkdir -p css js
          cp /tmp/redesign/index.html index.html
          cp /tmp/redesign/css/styles.css css/styles.css
          cp /tmp/redesign/js/app.js js/app.js
          wc -c index.html css/styles.css js/app.js

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html css/styles.css js/app.js
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "Apply premium Fly Go Asset Hub frontend redesign"
          git push
