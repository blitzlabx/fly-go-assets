<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Fly Go Assets</title>
  <style>
    :root {
      --bg: #0a0e17;
      --text: #e8eef7;
      --accent: #3b82f6;
      --muted: #94a3b8;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem;
      text-align: center;
    }
    h1 { font-size: 2.5rem; margin-bottom: 0.5rem; letter-spacing: -0.02em; }
    p { color: var(--muted); max-width: 32rem; line-height: 1.6; }
    a { color: var(--accent); text-decoration: none; }
    a:hover { text-decoration: underline; }
    .links { margin-top: 2rem; display: flex; gap: 1.5rem; flex-wrap: wrap; justify-content: center; }
  </style>
</head>
<body>
  <h1>Fly Go Assets</h1>
  <p>Official asset repository for the Fly Go universe — characters, branding, data, and creative guidelines.</p>
  <div class="links">
    <a href="https://github.com/blitzlabx/fly-go-assets">GitHub</a>
    <a href="docs/UNIVERSE.md">Universe</a>
    <a href="docs/CHARACTERS.md">Characters</a>
  </div>
</body>
</html>
